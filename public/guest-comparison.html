<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guests Page Comparison</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 2rem;
      background: #f1f5f9;
    }
    h1 {
      text-align: center;
      margin-bottom: 2rem;
      color: #1e293b;
    }
    .comparison {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 1600px;
      margin: 0 auto;
    }
    .panel {
      flex: 1;
      min-width: 400px;
      max-width: 700px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .panel h2 {
      margin: 0;
      padding: 1rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      color: #334155;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }
    .panel img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 80vh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <h1>Guests Page Comparison</h1>
  <div class="comparison">
    <div class="panel">

    <div class="panel">

  </div>
</body>
</html>
